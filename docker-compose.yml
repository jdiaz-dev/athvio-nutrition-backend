  postgres:
    image: postgres:16-alpine
    container_name: athvio-nutrition-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athvio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athvio}
      POSTGRES_DB: ${POSTGRES_DB:-athvio}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
